<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  const nf = (v, c = 2) => Math.abs(v).toLocaleString("pt-BR", { minimumFractionDigits: c, maximumFractionDigits: c });
  const usd = (v) => (v >= 0 ? "+" : "−") + "US$ " + nf(v);

  const $ = (id) => document.getElementById(id);

  // ---------- cena ----------
  const caixa = $("cena");
  const R = new THREE.WebGLRenderer({ antialias: true });
  R.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
  R.shadowMap.enabled = true; R.shadowMap.type = THREE.PCFSoftShadowMap;
  R.outputEncoding = THREE.sRGBEncoding;

  const ALVO = new THREE.Vector3(-1, 0, 4);

  S.add(new THREE.HemisphereLight(0x9fb4d8, 0x1a1408, 0.4));
  const sol = new THREE.DirectionalLight(0xfff2dc, 0.6); sol.position.set(-14, 28, 18); sol.castShadow = true;
  sol.shadow.mapSize.set(2048, 2048); Object.assign(sol.shadow.camera, { left: -26, right: 26, top: 22, bottom: -22, near: 1, far: 80 }); S.add(sol);

  }

  }

  const logoM = new THREE.Mesh(new THREE.ExtrudeGeometry([forma(P1), forma(P2)], { depth: 0.15, bevelEnabled: false }), brilho(OURO, 0.7));
  logoM.position.set(-4, 2.6, -LZ + 0.05); S.add(logoM);

  // telão na parede (textura desenhada em canvas)
  const tc = document.createElement("canvas"); tc.width = 1024; tc.height = 384; const tx = tc.getContext("2d");
  const telaoTex = new THREE.CanvasTexture(tc); telaoTex.encoding = THREE.sRGBEncoding;
  bloco(10.4, 4.2, 0.2, mat(0x101317), 6, 2.7, -LZ + 0.1);
  const telao = new THREE.Mesh(new THREE.PlaneGeometry(10, 3.75), new THREE.MeshBasicMaterial({ map: telaoTex, toneMapped: false }));
  telao.position.set(6, 2.7, -LZ + 0.22); S.add(telao);
  function desenhaTelao() {
    const M = (D && D.mt4) || {}, cal = M.calendario || [], hoje = (M.agora_srv || "").slice(0, 10), dia = cal.find((x) => x.dia === hoje);
    tx.fillStyle = "#060a12"; tx.fillRect(0, 0, 1024, 384);
    tx.fillStyle = "rgba(226,184,92,.9)"; tx.fillRect(0, 0, 1024, 6);
    tx.font = "600 34px Jost, sans-serif"; tx.fillStyle = "#8ea1bd"; tx.fillText("RESULTADO DO DIA", 40, 70);
    const p = dia && dia.pct != null ? dia.pct : 0;
    tx.font = "600 120px 'IBM Plex Mono', monospace"; tx.fillStyle = p >= 0 ? "#4fd18f" : "#ff6f61"; tx.fillText(dia ? pct(p) : "—", 34, 200);
    tx.font = "500 34px Jost, sans-serif"; tx.fillStyle = "#e9eef6";

    tx.fillStyle = "#ff6f61"; tx.beginPath(); tx.arc(900, 60, 12, 0, 7); tx.fill(); tx.fillStyle = "#e9eef6"; tx.font = "600 30px Jost"; tx.fillText("LIVE", 922, 71);
    telaoTex.needsUpdate = true;
  }

  // ---------- mesas (até 12 operações ao mesmo tempo) ----------
  const mesas = [];
  const corMonitor = new THREE.Color();
  for (let r = 0; r < 3; r++) for (let c = 0; c < 4; c++) {
    const x = -12 + c * 5, z = -4.2 + r * 4.6, g = new THREE.Group(); g.position.set(x, 0, z); S.add(g);
    bloco(3.2, 0.12, 1.5, mat(0x5c6168), 0, 1.0, 0, g);
    bloco(0.1, 1, 1.3, mat(0x55595f), -1.5, 0.5, 0, g); bloco(0.1, 1, 1.3, mat(0x55595f), 1.5, 0.5, 0, g);
    const tela = bloco(1.5, 0.9, 0.08, brilho(0x1a2a44, 0.6), 0, 1.65, -0.45, g);
    bloco(0.1, 0.5, 0.1, mat(0x333333), 0, 1.25, -0.45, g);
    bloco(1.1, 0.04, 0.4, mat(0x222222), 0, 1.08, 0.1, g);       // teclado
    const faixa = bloco(3.4, 0.04, 1.7, brilho(0x222830, 0.2), 0, 0.03, 0, g);   // luz no chão da mesa (cor do tipo)
    bloco(0.8, 0.1, 0.8, mat(0x1d2027), 0, 0.6, 1.1, g);          // cadeira
    bloco(0.8, 0.8, 0.1, mat(0x1d2027), 0, 1.0, 1.5, g);
    mesas.push({ g, tela, faixa, x, z, livre: true });
  }
  function pintaMesa(m, op) {
    if (!op) { m.tela.material.color.set(0x1a2a44); m.tela.material.emissive.set(0x1a2a44); m.tela.material.emissiveIntensity = 0.4; m.faixa.material.emissive.set(0x222830); m.faixa.material.emissiveIntensity = 0.2; return; }
    const ok = (op.lucro || 0) >= 0; corMonitor.set(ok ? 0x2fbf73 : 0xe0544a);
    m.tela.material.color.copy(corMonitor); m.tela.material.emissive.copy(corMonitor); m.tela.material.emissiveIntensity = 1.1;
    m.faixa.material.emissive.set(op.tipo === "swing" ? AZUL : OURO); m.faixa.material.emissiveIntensity = 0.9;
  }

  // ---------- área de descanso: café e bilhar ----------
  bloco(6, 1.1, 1.2, mat(0x5a3d26), 11, 0.55, -8.5); bloco(0.9, 1.3, 0.8, mat(0x2d3038), 9, 1.75, -8.6); bloco(0.5, 0.2, 0.1, brilho(0x5fe8ff, 2), 9, 1.9, -8.18);
  bloco(4, 0.7, 1.4, mat(0x6b2a44), 11.5, 0.35, -2.2); bloco(4, 0.9, 0.4, mat(0x7d3352), 11.5, 0.9, -2.8);   // sofá
  bloco(4.4, 0.9, 2.6, mat(0x4a2e1c), 10.5, 0.45, 5); bloco(4, 0.08, 2.2, mat(0x1f7a4a), 10.5, 0.93, 5);     // bilhar
  const bolas = [0xffffff, OURO, 0xe0544a, 0x5aa0e6, 0x2b2b2b].map((c, i) => { const b = new THREE.Mesh(new THREE.SphereGeometry(0.12, 12, 8), mat(c, { roughness: 0.2 })); b.position.set(9.6 + i * 0.4, 1.06, 4.6 + (i % 2) * 0.5); S.add(b); return b; });
  [[-13.8, 8.8], [13.8, 8.8], [13.8, -1], [-13.8, -8.5]].forEach(([x, z]) => {           // plantas
    bloco(0.7, 0.6, 0.7, mat(0x3a3d44), x, 0.3, z);
    const f = new THREE.Mesh(new THREE.ConeGeometry(0.6, 1.6, 6), mat(0x55d6c2, { emissive: 0x1a6b5f, emissiveIntensity: 0.4 })); f.position.set(x, 1.4, z); f.castShadow = true; S.add(f);
  });
  const LAZER = [[9.6, -7.3], [11.4, -7.3], [13, -7.3], [10.5, -1.2], [12.5, -1.2], [8.2, 5], [12.8, 5.4], [10.5, 7.2], [9, 3], [12.2, 2.6]];

  // ---------- operadores ----------
  const CAMISAS = [0x2d6cdf, 0xd9524a, 0x2fa36b, 0x8b5bd6, 0xe2a23a, 0x3fb6c9, 0xd06aa0, 0x6f7a8a];
  const PELE = [0xf1c9a0, 0xd9a77c, 0xa8724a, 0x7a4e2e];
  const ops = [];   // operadores
  let nId = 0;
  function novoOperador() {
    const g = new THREE.Group(), id = nId++;
    const camisa = mat(CAMISAS[id % CAMISAS.length]), calca = mat(0x23262d), pele = mat(PELE[id % PELE.length]);
    const pernaE = new THREE.Group(), pernaD = new THREE.Group();
    bloco(0.22, 0.7, 0.24, calca, 0, -0.35, 0, pernaE); bloco(0.22, 0.7, 0.24, calca, 0, -0.35, 0, pernaD);
    pernaE.position.set(-0.14, 0.75, 0); pernaD.position.set(0.14, 0.75, 0); g.add(pernaE, pernaD);

    const bE = new THREE.Group(), bD = new THREE.Group();
    bloco(0.16, 0.6, 0.18, camisa, 0, -0.28, 0, bE); bloco(0.16, 0.6, 0.18, camisa, 0, -0.28, 0, bD);

    const cab = new THREE.Mesh(new THREE.SphereGeometry(0.25, 14, 10), pele); cab.position.set(0, 1.78, 0); cab.castShadow = true; g.add(cab);
    const cabelo = new THREE.Mesh(new THREE.SphereGeometry(0.26, 14, 8, 0, Math.PI * 2, 0, Math.PI / 2.2), mat(id % 3 ? 0x2a1d14 : 0x111111)); cabelo.position.set(0, 1.82, 0); g.add(cabelo);
    const fone = bloco(0.56, 0.06, 0.08, brilho(0xe2b85c, 0.6), 0, 2.02, 0, g);   // headset dourado
    g.scale.setScalar(0.95);
    S.add(g);
    const lazer = LAZER[id % LAZER.length];
    const o = { id, g, pernaE, pernaD, bE, bD, tronco, op: null, mesa: null, x: lazer[0], z: lazer[1], tx: lazer[0], tz: lazer[1], anda: false, fase: Math.random() * 6, espera: 0, lazerIdx: id % LAZER.length };
    g.position.set(o.x, 0, o.z);
    ops.push(o); return o;
  }
  function vaiLazer(o) { const l = LAZER[o.lazerIdx]; o.tx = l[0] + (Math.random() - 0.5) * 0.6; o.tz = l[1] + (Math.random() - 0.5) * 0.6; }
  function vaiMesa(o, m) { o.tx = m.x; o.tz = m.z + 1.15; }

  // ---------- rótulos HTML sobre a cena ----------
  const camada = $("rotulos"), v3 = new THREE.Vector3();
  function tela(x, y, z) { v3.set(x, y, z).project(cam); return [(v3.x + 1) / 2 * innerWidth, (1 - v3.y) / 2 * innerHeight]; }
  const baloes = [];
  function balao(o, v) {
    const d = document.createElement("div"); d.className = "balao" + (v < 0 ? " neg" : ""); d.textContent = (v >= 0 ? "✓ " : "") + usd(v || 0);
    camada.appendChild(d); baloes.push({ d, x: o.g.position.x, z: o.g.position.z, t: 0 });
  }

  // ---------- dados ----------
  let D = null, primeira = true;
  const chave = (o) => [o.par, o.lado, o.lote, o.abre].join("|");
  async function busca() {
    let txt = null;
    if (/github\.io$/.test(location.hostname)) {
      try { const r = await fetch("https://api.github.com/repos/allisoncord-cpu/painel/contents/data.js", { headers: { Accept: "application/vnd.github.raw" }, cache: "no-store" }); if (r.ok) txt = await r.text(); } catch (e) {}
    }
    if (!txt) { try { txt = await (await fetch("data.js?" + Date.now(), { cache: "no-store" })).text(); } catch (e) { return; } }
    try { aplica(JSON.parse(txt.slice(txt.indexOf("{"), txt.lastIndexOf("}") + 1))); } catch (e) {}
  }
  function aplica(novo) {
    D = novo;
    const M = D.mt4 || {};
    const abertas = (M.abertas || []).map((o) => ({ ...o, k: chave(o) }));
    const fechadas = [...((M.por_tipo && M.por_tipo.robo && M.por_tipo.robo.ultimas) || []), ...((M.por_tipo && M.por_tipo.swing && M.por_tipo.swing.ultimas) || [])];
    const ks = new Set(abertas.map((o) => o.k));
    ops.forEach((o) => {
      if (o.op && !ks.has(o.op.k)) {
        const f = fechadas.find((x) => chave(x) === o.op.k);
        if (!primeira) balao(o, f ? f.usd : o.op.lucro);
        pintaMesa(mesas[o.mesa], null); mesas[o.mesa].livre = true;
        o.op = null; o.mesa = null; o.espera = 2.5; vaiLazer(o);
      }
    });
    abertas.forEach((a) => {
      const o = ops.find((x) => x.op && x.op.k === a.k);
      if (o) { o.op = a; pintaMesa(mesas[o.mesa], a); return; }
      const mi = mesas.findIndex((m) => m.livre); if (mi < 0) return;
      const livre = ops.find((x) => !x.op && x.espera <= 0) || novoOperador();
      livre.op = a; livre.mesa = mi; mesas[mi].livre = false; vaiMesa(livre, mesas[mi]); pintaMesa(mesas[mi], a);
      if (primeira) { livre.x = livre.tx; livre.z = livre.tz; }
    });
    while (ops.filter((o) => !o.op).length < 5) novoOperador();
    extra = Math.max(0, abertas.length - mesas.length);
    primeira = false;
    // HUD
    const cal = M.calendario || [], hoje = (M.agora_srv || "").slice(0, 10), dia = cal.find((x) => x.dia === hoje);
    $("t-dia").textContent = dia && dia.pct != null ? pct(dia.pct) : "—";
    $("t-dia").style.color = dia && dia.pct < 0 ? "var(--verm)" : "var(--verde)";
    const trab = abertas.length, desc = ops.filter((o) => !o.op).length;
    $("t-sub").innerHTML = `${trab} em operação · ${desc} em descanso` + (M.flutuante != null ? ` · em aberto <b style="color:${M.flutuante >= 0 ? "var(--verde)" : "var(--verm)"}">${usd(M.flutuante)}</b>` : "");
    desenhaTelao();
  }
  let extra = 0;

  // ---------- câmera isométrica ----------
  function ajusta() {
    const w = innerWidth, h = innerHeight; R.setSize(w, h);
    const asp = w / h; estreito = asp < 0.8;
    const alvoLarg = estreito ? 27 : 46;   // largura do mundo visível (no celular a câmera chega mais perto)
    const meiaL = alvoLarg / 2, meiaA = meiaL / asp, desl = estreito ? 0.22 : 0;   // no celular a cena desce, abaixo do placar
    Object.assign(cam, { left: -meiaL, right: meiaL, top: meiaA * (1 + desl), bottom: -meiaA * (1 - desl) }); cam.updateProjectionMatrix();
    document.body.classList.toggle("estreito", estreito);
  }

  // ---------- laço ----------
  let tAnt = performance.now(), T = 0, estreito = false;
  function quadro(agora) {
    const dt = Math.min(0.05, (agora - tAnt) / 1000); tAnt = agora; T += dt;
    const ang = Math.PI / 4 + Math.sin(T * 0.08) * 0.12;   // câmera balança devagar
    cam.position.set(ALVO.x + Math.sin(ang) * 40, 32, ALVO.z + Math.cos(ang) * 40); cam.lookAt(ALVO);
    bolas[0].position.x = 10.5 + Math.sin(T * 0.9) * 1.5; bolas[0].position.z = 5 + Math.cos(T * 1.3) * 0.8;

    ops.forEach((o) => {
      o.espera = Math.max(0, o.espera - dt);
      if (o.espera <= 0 && !o.op && Math.random() < dt * 0.03) vaiLazer(o);
      const dx = o.tx - o.x, dz = o.tz - o.z, d = Math.hypot(dx, dz), v = 3.2 * dt;
      o.anda = o.espera <= 0 && d > 0.05;
      if (o.anda) { const k = Math.min(1, v / d); o.x += dx * k; o.z += dz * k; o.g.rotation.y = Math.atan2(dx, dz); }
      o.g.position.set(o.x, 0, o.z);
      const sentado = o.op && !o.anda && d < 0.1;
      const passo = o.anda ? Math.sin(T * 10 + o.fase) * 0.6 : 0;
      o.pernaE.rotation.x = sentado ? -1.4 : passo; o.pernaD.rotation.x = sentado ? -1.4 : -passo;
      o.bE.rotation.x = sentado ? -0.9 + Math.sin(T * 14 + o.fase) * 0.08 : -passo * 0.8; o.bD.rotation.x = sentado ? -0.9 + Math.cos(T * 13 + o.fase) * 0.08 : passo * 0.8;
      o.g.position.y = sentado ? -0.18 : (o.anda ? Math.abs(Math.sin(T * 10 + o.fase)) * 0.06 : 0);
      if (sentado) o.g.rotation.y = Math.PI;
    });

    // rótulos das operações
    const usados = new Set();
    ops.forEach((o) => {
      if (!o.op) return;
      let el = o.el;
      if (!el) { el = o.el = document.createElement("div"); camada.appendChild(el); }
      usados.add(el);
      const a = o.op, ok = (a.lucro || 0) >= 0, nome = a.par.replace("XAUUSD", "OURO");
      el.className = "rot" + (a.tipo === "swing" ? " swing" : "");
      const html = estreito
        ? `<b><i></i>${nome.replace("USD", "")} ${a.lado === "buy" ? "C" : "V"}</b><span class="${ok ? "pos" : "neg"}">${a.lucro == null ? "" : (a.lucro >= 0 ? "+" : "−") + nf(a.lucro)}</span>`
        : `<b><i></i>${nome} · ${a.lado === "buy" ? "COMPRA" : "VENDA"} ${String(a.lote).replace(".", ",")}</b><span class="${ok ? "pos" : "neg"}">${a.lucro == null ? "" : usd(a.lucro)}</span>`;
      if (el.__h !== html) { el.innerHTML = html; el.__h = html; }
      const [sx, sy] = tela(o.x, 3.1, o.z - 0.6); el.style.left = sx + "px"; el.style.top = sy + "px";
    });
    [...camada.querySelectorAll(".rot")].forEach((el) => { if (!usados.has(el)) { el.remove(); ops.forEach((o) => { if (o.el === el) o.el = null; }); } });
    for (let i = baloes.length - 1; i >= 0; i--) {
      const b = baloes[i]; b.t += dt;
      if (b.t > 5) { b.d.remove(); baloes.splice(i, 1); continue; }
      const [sx, sy] = tela(b.x, 3.6 + b.t * 0.6, b.z); b.d.style.left = sx + "px"; b.d.style.top = sy + "px"; b.d.style.opacity = Math.min(1, (5 - b.t) / 1.2);
    }
    R.render(S, cam);
    requestAnimationFrame(quadro);
  }

  // ---------- "atualizado há" ----------
  setInterval(() => {
    if (!D) return;
    const s = Math.max(0, Math.round((Date.now() - new Date(D.atualizado).getTime()) / 1000));
    $("idade").textContent = s > 600 ? `Sem atualização há ${Math.round(s / 60)} min` : `Atualizado há ${s < 60 ? s + " s" : Math.round(s / 60) + " min"}`;
    $("dot").className = "dot" + (s > 600 ? " velho" : "");
  }, 1000);

  addEventListener("resize", ajusta); ajusta();
  for (let i = 0; i < 5; i++) novoOperador();
  desenhaTelao();
  document.fonts.ready.then(() => { desenhaTelao(); });
  requestAnimationFrame(quadro);
  busca(); setInterval(busca, 60000);
  window.__escritorio = { aplica, ops };   // para testes
})();
</script>
</body>
</html>
