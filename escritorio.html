      const aberta = !!p.op, a = p.op || p.resultado, v = aberta ? a.lucro : a.usd, ok = (v || 0) >= 0, nome = a.par.replace("XAUUSD", "OURO");
      const tipo = a.tipo || (a.par.startsWith("XAU") ? "robo" : "swing");
      el.className = "rot" + (ok ? "" : " neg") + (tipo === "swing" ? " swing" : "") + (aberta ? "" : " fechou") + (p.vip ? " vip" : "");
      const html = `${v == null ? "—" : usd(v)}<small>${aberta ? `<i></i>${estreito ? nome.replace("USD", "") : nome} ${a.lado === "buy" ? "C" : "V"} ${String(a.lote).replace(".", ",")}` : p.vip ? "👑 OPERADOR DO DIA" : (ok ? "🏆 META BATIDA" : "FECHOU")}</small>`;
      if (el.__h !== html) { el.innerHTML = html; el.__h = html; }
      const [sx, sy] = tela(p.x, p.op ? 3.0 : 2.75, p.z - 0.2); el.style.left = sx + "px"; el.style.top = sy + "px";
    });
    if (!MERC.aberto) mesas.forEach((m) => {
      if (!m.op) { if (m.el) { m.el.remove(); m.el = null; } return; }
      let el = m.el; if (!el) { el = m.el = document.createElement("div"); camada.appendChild(el); }
      usados.add(el);
      const a = m.op, ok = (a.lucro || 0) >= 0, nome = a.par.replace("XAUUSD", "OURO");
      el.className = "rot" + (ok ? "" : " neg") + (a.tipo === "swing" ? " swing" : "");
      const h4 = `${a.lucro == null ? "—" : usd(a.lucro)}<small><i></i>${nome} ${a.lado === "buy" ? "C" : "V"} · em aberto</small>`;
      if (el.__h !== h4) { el.innerHTML = h4; el.__h = h4; }
      const [sx, sy] = tela(m.x, 2.9, m.z + 0.8); el.style.left = sx + "px"; el.style.top = sy + "px";
    });
    else mesas.forEach((m) => { if (m.el) { m.el.remove(); m.el = null; } });
    [...camada.querySelectorAll(".rot")].forEach((el) => { if (!usados.has(el)) { el.remove(); gente.forEach((p) => { if (p.el === el) p.el = null; }); } });
    for (let i = baloes.length - 1; i >= 0; i--) {
      const b = baloes[i]; b.t += dt;
      if (b.t > b.dur) { b.d.remove(); baloes.splice(i, 1); continue; }
      const [sx, sy] = b.p ? tela(b.p.x, 2.5, b.p.z) : tela(b.x, 3.4 + b.t * 0.5, b.z);
      b.d.style.left = sx + "px"; b.d.style.top = sy + "px"; b.d.style.opacity = Math.min(1, (b.dur - b.t) / 1);
    }
    R.render(S, cam);
  }

  setInterval(() => {
    if (!D) return;
    const s = Math.max(0, Math.round((Date.now() - new Date(D.atualizado).getTime()) / 1000));
    $("idade").textContent = s > 600 ? `Sem atualização há ${Math.round(s / 60)} min` : `Atualizado há ${s < 60 ? s + " s" : Math.round(s / 60) + " min"}`;
    $("dot").className = "dot" + (s > 600 ? " velho" : "");
  }, 1000);

  addEventListener("resize", ajusta); ajusta();
  if (MERC.aberto) for (let i = 0; i < 6; i++) { const p = novaPessoa("livre"); proximoPonto(p); p.x = p.tx; p.z = p.tz; }
  desenhaTelao(); document.fonts.ready.then(() => { desenhaTelao(); desenhaQuadros(); });
  if (window.LEGATUS_DADOS) aplica(window.LEGATUS_DADOS);
  if (VIDEO) {
    const q = new URLSearchParams(location.search).get("dia"), cal = ((D && D.mt4 && D.mt4.calendario) || []);
    VDIA = cal.find((c) => c.dia === q) || cal[cal.length - 1] || null;
    if (!mesas.some((m) => m.op)) for (let i = 0; i < 9; i++) { const p = novaPessoa("livre"); vaiAnalisar(p); p.x = p.tx; p.z = p.tz; p.rot = Math.PI; }   // dia passado: equipe analisando
    mesaVideo = mesas.find((m) => m.op && m.op.tipo !== "swing") || mesas.find((m) => m.op) || mesas.find((m) => m.analisa) || mesas[0];
    for (let i = 0; i < 240; i++) passo(1 / 30);   // 8 s de simulação antes de gravar (todos nos lugares)
    const v = VDIA ? VDIA.pct : null;
    $("vfim-n").textContent = v != null ? pct(v) : "—"; $("vfim-n").style.color = v != null && v < 0 ? "var(--verm)" : "var(--verde)";
    $("vfim-s").textContent = VDIA ? `${VDIA.ops} operações · ${VDIA.venc} no verde` : "";
    let ultT = 0;
    window.render = (t) => {
      while (ultT < t - 1e-6) { const d = Math.min(1 / 30, t - ultT); ultT += d; VT = ultT; passo(d); }   // passos curtos, mesmo se pular tempo
      legendasVideo(t);
      const festa = VDIA && VDIA.pct > 0;
      if (festa && !festaFeita && t >= 25.2) {
        festaFeita = true; $("banner").querySelector("b").textContent = "FECHAMENTO DO DIA"; $("banner-v").textContent = pct(VDIA.pct); $("banner-s").textContent = `${VDIA.venc} de ${VDIA.ops} operações no verde`;
        gente.forEach((p) => { if (p.papel !== "saindo") p.festa = 3.5; });
        const cores = ["#e2b85c", "#4fd18f", "#ffffff", "#5aa0e6", "#ff9f43"];
        confetes = Array.from({ length: 140 }, () => { const c = document.createElement("div"); c.className = "confete"; c.style.background = escolhe(cores); document.body.appendChild(c); return { c, x: rnd(0, 1080), v: rnd(500, 900), r: rnd(200, 700), d: rnd(0, 0.8) }; });
      }
      const bk = festa ? Math.max(0, Math.min(1, (t - 25.2) / 0.35, (29 - t) / 0.4)) : 0;
      $("banner").style.opacity = bk; $("banner").style.transform = `translate(-50%, -50%) scale(${0.7 + 0.3 * Math.min(1, (t - 25.2) / 0.35)})`;
      confetes.forEach((q) => { const tt = t - 25.2 - q.d; q.c.style.display = tt > 0 && tt < 3.5 ? "block" : "none"; q.c.style.left = q.x + "px"; q.c.style.top = (-30 + tt * q.v) + "px"; q.c.style.transform = `rotate(${tt * q.r}deg)`; });
    };
    window.DURACAO = 33;
  } else {
    requestAnimationFrame(quadro);
    busca(); setInterval(busca, 60000);
  }
  $("zoomq").addEventListener("click", () => ($("zoomq").hidden = true));
  window.__escritorio = { aplica, gente, comemora };
})();
</script>
