      recentes.filter((f) => !vistas.has(chaveF(f))).slice(0, 6).reverse().forEach((f) => {
        vistas.add(chaveF(f));
        if (f.usd > 0) chegaComResultado(f, true);
        else balao(PORTA.x + 1.5, PORTA.z, f.usd);   // fechou no negativo entre uma leitura e outra: só o balão na porta
      });
    }
    // os jogadores de bilhar e pingue-pongue levam os últimos resultados positivos
    const pos = recentes.filter((f) => f.usd > 0);
    [...jogBilhar, ...jogPing].forEach((j, i) => { if (pos[i]) j.resultado = pos[i]; });
    limita();
    gente.filter((p) => p.papel === "livre" && !p.resultado).slice(3).forEach(sai);   // sem resultado, só alguns figurantes
    while (gente.filter((p) => p.papel === "livre").length < 3) { const p = novaPessoa("livre"); proximoPonto(p); p.x = p.tx; p.z = p.tz; }
    primeira = false;
    const cal = M.calendario || [], hoje = (M.agora_srv || "").slice(0, 10), dia = cal.find((x) => x.dia === hoje);
    $("t-dia").textContent = dia && dia.pct != null ? pct(dia.pct) : "—"; $("t-dia").style.color = dia && dia.pct < 0 ? "var(--verm)" : "var(--verde)";
    $("t-sub").innerHTML = `${abertas.length} em operação · ${gente.filter((p) => p.resultado && p.papel !== "saindo").length} já fecharam` + (M.flutuante != null ? ` · em aberto <b style="color:${M.flutuante >= 0 ? "var(--verde)" : "var(--verm)"}">${usd(M.flutuante)}</b>` : "");
    // faixa de notícias embaixo
    const ult = fechadas.slice().sort((a, b) => (a.t < b.t ? 1 : -1)).slice(0, 8);
    $("ticker").innerHTML = `<b class="ouro">LEGATUS GOLD</b> · RESULTADOS AO VIVO DA CONTA REAL · ` + (dia ? `HOJE <b class="${dia.pct >= 0 ? "pos" : "neg"}">${pct(dia.pct)}</b> · ` : "") + `${abertas.length} OPERAÇÕES ABERTAS · ` +
      ult.map((f) => `${f.par.replace("XAUUSD", "OURO")} ${f.lado === "buy" ? "C" : "V"} <b class="${f.usd >= 0 ? "pos" : "neg"}">${usd(f.usd)}</b>`).join(" · ") + " · ATUALIZADO A CADA MINUTO · RESULTADO PASSADO NÃO GARANTE RESULTADO FUTURO";
    desenhaTelao();
  }

  // ================= câmera (arrastar gira, rolar/pinça aproxima) =================
  let estreito = false, giro = Math.PI / 4, zoom = 1, arrasta = null, ultimoToque = -1e9;
  function ajusta() {
    const w = innerWidth, h = innerHeight; R.setSize(w, h);
    const asp = w / h; estreito = asp < 0.8;
    LIMITE = estreito ? 6 : 10;
    const larg = (estreito ? 23 : 47) / zoom, meiaL = larg / 2, meiaA = meiaL / asp, desl = estreito ? 0.22 : 0.05;
    Object.assign(cam, { left: -meiaL, right: meiaL, top: meiaA * (1 + desl), bottom: -meiaA * (1 - desl) }); cam.updateProjectionMatrix();
    document.body.classList.toggle("estreito", estreito);
  }
  R.domElement.addEventListener("pointerdown", (e) => { arrasta = { x: e.clientX, g: giro }; ultimoToque = performance.now(); });
  addEventListener("pointermove", (e) => { if (arrasta) { giro = arrasta.g - (e.clientX - arrasta.x) * 0.006; ultimoToque = performance.now(); } });
  addEventListener("pointerup", () => (arrasta = null));
  R.domElement.addEventListener("wheel", (e) => { e.preventDefault(); zoom = Math.min(2.2, Math.max(0.8, zoom * (e.deltaY < 0 ? 1.1 : 0.9))); ajusta(); ultimoToque = performance.now(); }, { passive: false });

  // ================= animação =================
  let tAnt = performance.now(), T = 0, tMon = 0, proxFala = 4;
  function anima(p, dt) {
    p.espera = Math.max(0, p.espera - dt); p.comemora = Math.max(0, (p.comemora || 0) - dt);
    const dx = p.tx - p.x, dz = p.tz - p.z, d = Math.hypot(dx, dz);
    const anda = p.espera <= 0 && d > 0.05;
    if (anda) { const k = Math.min(1, 2.4 * dt / d); p.x += dx * k; p.z += dz * k; let a = Math.atan2(dx, dz) - p.rot; a = Math.atan2(Math.sin(a), Math.cos(a)); p.rot += a * Math.min(1, dt * 10); }
    else if (p.alvoRot != null) { let a = p.alvoRot - p.rot; a = Math.atan2(Math.sin(a), Math.cos(a)); p.rot += a * Math.min(1, dt * 6); }
    p.g.position.set(p.x, 0, p.z); p.g.rotation.y = p.rot;
    const s = anda ? Math.sin(T * 9 + p.fase) * 0.6 : 0;
    let senta = false, pernas = [s, -s], bracos = [-s * 0.7, s * 0.7], ab = [0, 0], cx = 0, cy = 0, y = anda ? Math.abs(Math.sin(T * 9 + p.fase)) * 0.04 : 0, incl = 0;
    if (!anda) {
      const ac = p.ponto && p.ponto.acao;
      if (p.papel === "trabalha" || p.papel === "reuniao" || ac === "sofa" || ac === "banqueta") senta = true;
      if (p.papel === "trabalha") { bracos = [-1.15 + Math.sin(T * 16 + p.fase) * 0.06, -1.15 + Math.cos(T * 15 + p.fase) * 0.06]; ab = [0.25, -0.25]; cy = Math.sin(T * 0.5 + p.fase) * 0.25; }
      if (p.papel === "reuniao") { cy = Math.sin(T * 0.6 + p.fase) * 0.5; bracos = [-0.7, -0.7 + Math.max(0, Math.sin(T * 1.3 + p.fase)) * 0.5]; }
      if (p.papel === "apresenta") { bracos = [0, -1.5 + Math.sin(T * 2) * 0.5]; cy = Math.sin(T * 0.7) * 0.6; }
      if (ac === "cafe" || ac === "conversa" || ac === "banqueta") { if (!p.item.children.length && ac !== "conversa") segura(p, "caneca"); bracos = [0, -1.0 - Math.max(0, Math.sin(T * 0.8 + p.fase)) * 0.6]; cy = Math.sin(T * 0.9 + p.fase) * 0.35; }
      if (ac === "telao") cx = -0.3;
      if (ac === "torcida") { bracos = [-0.3 - Math.max(0, Math.sin(T * 2 + p.fase)) * 2.2, -0.3]; cy = Math.sin(T * 0.8 + p.fase) * 0.3; }
      if (p.papel === "bilhar") {
        const minha = jogBilhar.indexOf(p) === vezB;
        if (minha) { const puxa = Math.max(0, Math.sin(tacada * 2.4)); incl = 0.75; cx = -0.5; bracos = [-1.2, -1.25 + puxa * 0.3]; y = -0.08; }
        else { bracos = [0.1, -0.2]; cy = Math.sin(T * 0.5) * 0.4; }
      }
      if (p.papel === "ping") { const lado = jogPing.indexOf(p) ? 1 : -1, golpe = Math.sin(T * 3.2 + (lado > 0 ? Math.PI : 0)); bracos = [-0.3, -0.9 + golpe * 0.5]; ab = [0, -0.5 * golpe]; incl = 0.15; y = Math.abs(golpe) * 0.03; p.g.position.z = p.z + golpe * 0.3; }
    }
    if (p.comemora > 0 && anda) { bracos = [-2.9, -2.9]; }
    if (senta) { pernas = [-1.5, -1.5]; y = p.ponto && p.ponto.acao === "sofa" ? -0.35 : -0.15; incl = 0; }
    p.pE.rotation.x = pernas[0]; p.pD.rotation.x = pernas[1]; p.bE.rotation.x = bracos[0]; p.bD.rotation.x = bracos[1]; p.bE.rotation.z = ab[0]; p.bD.rotation.z = ab[1];
    p.cab.rotation.set(cx, cy, 0); p.g.position.y = y; p.g.rotation.x = incl;
    if (p.papel === "livre" && !anda && p.espera <= 0) { if (!p.ate) p.ate = T + rnd(8, 18); if (T > p.ate) { p.ate = 0; proximoPonto(p); } }
    if (p.papel === "saindo" && d < 0.2) { S.remove(p.g); if (p.el) p.el.remove(); p.removido = true; }
  }
  function quadro(agora) {
    const dt = Math.min(0.05, (agora - tAnt) / 1000); tAnt = agora; T += dt;
    if (!arrasta && performance.now() - ultimoToque > 8000) giro += (Math.PI / 4 + Math.sin(T * 0.07) * 0.14 - giro) * dt * 0.4;
    cam.position.set(ALVO.x + Math.sin(giro) * 40, 32, ALVO.z + Math.cos(giro) * 40); cam.lookAt(ALVO);
    // bilhar
    tacada += dt; if (tacada > 6) { tacada = 0; vezB = 1 - vezB; const b = bolas[0]; b.vx = rnd(-1.8, 1.8); b.vz = rnd(-0.9, 0.9); bolas.slice(1).forEach((x) => { if (Math.random() < 0.4) { x.vx = rnd(-0.8, 0.8); x.vz = rnd(-0.5, 0.5); } }); }
    bolas.forEach((b) => { b.m.position.x += b.vx * dt; b.m.position.z += b.vz * dt; b.vx *= 0.985; b.vz *= 0.985;
      if (Math.abs(b.m.position.x - BX) > 1.95) { b.vx *= -1; b.m.position.x = BX + Math.sign(b.m.position.x - BX) * 1.95; }
      if (Math.abs(b.m.position.z - BZ) > 0.95) { b.vz *= -1; b.m.position.z = BZ + Math.sign(b.m.position.z - BZ) * 0.95; } });
    // pingue-pongue: a bolinha vai e volta em arco
    const fp = (Math.sin(T * 3.2) + 1) / 2; bolinha.position.set(PX - 1.8 + fp * 3.6, 1.1 + Math.abs(Math.sin(T * 6.4)) * 0.5, PZ + Math.sin(T * 1.7) * 0.5);
    // cachorro passeia pela área de descanso e volta para a caminha
    if (T > dg.ate) { const casa = Math.random() < 0.35; dg.tx = casa ? 13.2 : rnd(5, 13.5); dg.tz = casa ? 6.2 : rnd(0, 9); dg.ate = T + rnd(6, 12); }
    const ddx = dg.tx - dg.x, ddz = dg.tz - dg.z, dd = Math.hypot(ddx, ddz), dAnda = dd > 0.05;
    if (dAnda) { const k = Math.min(1, 1.8 * dt / dd); dg.x += ddx * k; dg.z += ddz * k; dog.rotation.y = Math.atan2(-ddz, ddx); }
    dog.position.set(dg.x, dAnda ? Math.abs(Math.sin(T * 14)) * 0.04 : 0, dg.z);
    patas.forEach((pt, i) => (pt.rotation.z = dAnda ? Math.sin(T * 14 + i * Math.PI) * 0.5 : 0)); rabo.rotation.y = Math.sin(T * 12) * 0.6;
    gente.forEach((p) => anima(p, dt));
    for (let i = gente.length - 1; i >= 0; i--) if (gente[i].removido) gente.splice(i, 1);
    tMon += dt; if (tMon > 0.25) { tMon = 0; mesas.forEach((m) => desenhaMonitores(m, T)); mesas.forEach((m) => { m.led.material.emissiveIntensity = 1.2 + Math.sin(T * 3 + m.semente) * 0.8; }); }
    if (T > proxFala) { proxFala = T + rnd(5, 9); const p = escolhe(gente.filter((x) => x.papel !== "trabalha")); if (p) fala(p); }
    // rótulos verdes/vermelhos sobre quem está operando
    const usados = new Set();
    gente.forEach((p) => {
      if (!p.op && !p.resultado) return;
      let el = p.el; if (!el) { el = p.el = document.createElement("div"); camada.appendChild(el); }
      usados.add(el);
      const aberta = !!p.op, a = p.op || p.resultado, v = aberta ? a.lucro : a.usd, ok = (v || 0) >= 0, nome = a.par.replace("XAUUSD", "OURO");
      const tipo = a.tipo || (a.par.startsWith("XAU") ? "robo" : "swing");
      el.className = "rot" + (ok ? "" : " neg") + (tipo === "swing" ? " swing" : "") + (aberta ? "" : " fechou");
      const html = `${v == null ? "—" : usd(v)}<small><i></i>${aberta ? "" : "FECHOU · "}${estreito ? nome.replace("USD", "") : nome} ${a.lado === "buy" ? "C" : "V"}${aberta ? " " + String(a.lote).replace(".", ",") : ""}</small>`;
      if (el.__h !== html) { el.innerHTML = html; el.__h = html; }
      const [sx, sy] = tela(p.x, p.op ? 3.0 : 2.75, p.z - 0.2); el.style.left = sx + "px"; el.style.top = sy + "px";
    });
    [...camada.querySelectorAll(".rot")].forEach((el) => { if (!usados.has(el)) { el.remove(); gente.forEach((p) => { if (p.el === el) p.el = null; }); } });
    for (let i = baloes.length - 1; i >= 0; i--) {
      const b = baloes[i]; b.t += dt;
      if (b.t > b.dur) { b.d.remove(); baloes.splice(i, 1); continue; }
      const [sx, sy] = b.p ? tela(b.p.x, 2.5, b.p.z) : tela(b.x, 3.4 + b.t * 0.5, b.z);
      b.d.style.left = sx + "px"; b.d.style.top = sy + "px"; b.d.style.opacity = Math.min(1, (b.dur - b.t) / 1);
    }
    R.render(S, cam);
    requestAnimationFrame(quadro);
  }

  setInterval(() => {
    if (!D) return;
    const s = Math.max(0, Math.round((Date.now() - new Date(D.atualizado).getTime()) / 1000));
    $("idade").textContent = s > 600 ? `Sem atualização há ${Math.round(s / 60)} min` : `Atualizado há ${s < 60 ? s + " s" : Math.round(s / 60) + " min"}`;
    $("dot").className = "dot" + (s > 600 ? " velho" : "");
  }, 1000);

  addEventListener("resize", ajusta); ajusta();
  for (let i = 0; i < 6; i++) { const p = novaPessoa("livre"); proximoPonto(p); p.x = p.tx; p.z = p.tz; }
  desenhaTelao(); document.fonts.ready.then(desenhaTelao);
  requestAnimationFrame(quadro);
  busca(); setInterval(busca, 60000);
  window.__escritorio = { aplica, gente };
})();
</script>
